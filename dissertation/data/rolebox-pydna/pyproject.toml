[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roledna"
version = "0.1.0"
description = "Python Discourse Network Analysis for RoleBox"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Babajide Alamu Owoyele", email = "owoyele@rsm.nl"}
]
keywords = ["discourse-network-analysis", "dna", "network-analysis", "policy-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/babajideowoyele/kaobook"
Original = "https://github.com/leifeld/dna"

[tool.hatch.build.targets.wheel]
packages = ["src/roledna"]
