# RoleBox-Visual Conda Environment
# For visual materials analysis with multimodal LLMs
#
# Setup:
#   conda env create -f environment.yml
#   conda activate rolebox-visual
#
# For GPU acceleration (recommended for vision models):
#   Ensure CUDA is installed and PyTorch detects your GPU

name: rolebox-visual
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pandas>=2.0
  - numpy>=1.24
  - pillow>=10.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - scikit-learn>=1.3
  - scipy>=1.10
  - jupyter
  - jupyterlab
  - ipywidgets
  - tqdm
  - networkx>=3.0

  # PyTorch with CUDA support
  - pytorch>=2.0
  - torchvision
  - pytorch-cuda=12.1  # Adjust based on your CUDA version

  # For OpenCV (image processing)
  - opencv

  - pip
  - pip:
    # Transformers and HuggingFace
    - transformers>=4.40
    - accelerate>=0.27
    - bitsandbytes>=0.42  # For 8-bit quantization

    # Vision-Language Models
    - timm>=0.9  # PyTorch Image Models
    - einops>=0.7

    # Captioning models (choose one or more)
    - salesforce-lavis>=1.0  # BLIP-2
    # - llava  # LLaVA (install from source)

    # OmniParser dependencies
    - ultralytics>=8.0  # YOLO for detection
    - paddleocr>=2.6  # For OCR
    - paddlepaddle  # PaddlePaddle backend

    # Florence-2 (Microsoft's multimodal model)
    - flash-attn>=2.4  # Optional: faster attention

    # Image analysis
    - face-recognition  # For face detection
    - deepface  # For facial attribute analysis
    - clip-interrogator  # CLIP-based image analysis

    # Visualization
    - plotly>=5.0
    - gradio>=4.0  # For quick UI demos

    # Utilities
    - python-dotenv
    - huggingface-hub
    - safetensors
