[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rolebox-visual"
version = "0.1.0"
description = "Visual materials analysis for RoleBox - website screenshots and imagery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "tqdm",
    "networkx>=3.0",
]

[project.optional-dependencies]
vlm = [
    "transformers>=4.40",
    "accelerate>=0.27",
    "torch>=2.0",
    "torchvision",
    "timm>=0.9",
]
captioning = [
    "salesforce-lavis>=1.0",  # BLIP-2
]
ocr = [
    "paddleocr>=2.6",
    "paddlepaddle",
]
face = [
    "face-recognition",
    "deepface",
]
all = [
    "rolebox-visual[vlm,captioning,ocr,face]",
]

[project.scripts]
rolebox-visual-analyze = "rolebox_visual.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]
