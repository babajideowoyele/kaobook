<script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>
<script>
// Inline ForceAtlas2 implementation (simplified)
function forceAtlas2(graph, iterations, settings) {
  const { gravity = 1, scalingRatio = 10, strongGravityMode = false, linLogMode = false } = settings || {};
  const nodes = graph.nodes();
  const nodeData = {};

  // Initialize node positions and velocities
  nodes.forEach(n => {
    nodeData[n] = {
      x: graph.getNodeAttribute(n, 'x') || Math.random() * 100,
      y: graph.getNodeAttribute(n, 'y') || Math.random() * 100,
      dx: 0, dy: 0,
      mass: 1 + graph.degree(n)
    };
  });

  for (let iter = 0; iter < iterations; iter++) {
    // Reset forces
    nodes.forEach(n => { nodeData[n].dx = 0; nodeData[n].dy = 0; });

    // Repulsion (all pairs - simplified)
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const n1 = nodeData[nodes[i]], n2 = nodeData[nodes[j]];
        const dx = n1.x - n2.x, dy = n1.y - n2.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const force = scalingRatio * n1.mass * n2.mass / dist;
        const fx = (dx / dist) * force, fy = (dy / dist) * force;
        n1.dx += fx; n1.dy += fy;
        n2.dx -= fx; n2.dy -= fy;
      }
    }

    // Attraction (edges)
    graph.forEachEdge((e, attr, source, target) => {
      const n1 = nodeData[source], n2 = nodeData[target];
      if (!n1 || !n2) return;
      const dx = n1.x - n2.x, dy = n1.y - n2.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      let force = linLogMode ? Math.log(1 + dist) : dist;
      const fx = (dx / dist) * force, fy = (dy / dist) * force;
      n1.dx -= fx; n1.dy -= fy;
      n2.dx += fx; n2.dy += fy;
    });

    // Gravity
    nodes.forEach(n => {
      const node = nodeData[n];
      const dist = Math.sqrt(node.x * node.x + node.y * node.y) || 0.01;
      const gForce = strongGravityMode ? gravity * node.mass : gravity * node.mass / dist;
      node.dx -= (node.x / dist) * gForce;
      node.dy -= (node.y / dist) * gForce;
    });

    // Apply forces with speed limit
    const speed = 1 / (1 + Math.sqrt(nodes.length));
    nodes.forEach(n => {
      const node = nodeData[n];
      const force = Math.sqrt(node.dx * node.dx + node.dy * node.dy);
      if (force > 10) { node.dx = (node.dx / force) * 10; node.dy = (node.dy / force) * 10; }
      node.x += node.dx * speed;
      node.y += node.dy * speed;
    });
  }

  // Apply positions back to graph
  nodes.forEach(n => {
    graph.setNodeAttribute(n, 'x', nodeData[n].x);
    graph.setNodeAttribute(n, 'y', nodeData[n].y);
  });
}
</script>
<script>
const state = { screen: 'dashboard', networkData: null, communityData: null, statsData: null };
const screens = ['dashboard','seeds','discovery','network','regions','triangulation','bridging'];
const screenLabels = ['Dashboard','Seeds','Discovery','Network','Regions','Triangulation','Bridging'];

// ColorBrewer Set1 + Dark2 - colorblind-friendly categorical palette
const categoryPalette = [
  '#e41a1c', // red
  '#377eb8', // blue
  '#4daf4a', // green
  '#984ea3', // purple
  '#ff7f00', // orange
  '#a65628', // brown
  '#f781bf', // pink
  '#999999', // gray
  '#66c2a5', // teal
  '#fc8d62', // salmon
  '#8da0cb', // periwinkle
  '#e78ac3'  // rose
];

const communityColors = {
  'Climate-KIC': '#4daf4a',      // green
  'EIT Digital': '#377eb8',       // blue
  'InnoEnergy': '#ff7f00',        // orange
  'EIT Health': '#e41a1c',        // red
  'EIT RawMaterials': '#a65628',  // brown
  'EIT Food': '#66c2a5',          // teal
  'EIT Urban Mobility': '#984ea3' // purple
};

function getTopCommunities() {
  const comm = state.communityData;
  if (!comm) return [];

  const sizes = comm.community_sizes || [];
  const labels = comm.community_labels || {};

  const communities = sizes.map((size, idx) => {
    const label = labels[idx] || `Community ${idx}`;
    // Use named color if available, otherwise assign from palette based on index
    const color = communityColors[label] || categoryPalette[idx % categoryPalette.length];
    return { id: idx, size, label, color };
  });

  return communities.sort((a, b) => b.size - a.size);
}

// Load real data
async function loadData() {
  try {
    const [networkRes, communityRes, statsRes] = await Promise.all([
      fetch('network_data.json'),
      fetch('community_data.json'),
      fetch('network_stats.json')
    ]);
    state.networkData = await networkRes.json();
    state.communityData = await communityRes.json();
    state.statsData = await statsRes.json();
    console.log('Data loaded:', state.statsData.n_nodes, 'nodes');
    render();
  } catch(e) {
    console.log('Using mock data - JSON files not found');
  }
}
loadData();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2500);
}

function showScreen(s) {
  state.screen = s;
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-' + s).classList.add('active');
  render();
}

function renderNav() {
  document.getElementById('nav').innerHTML = screens.map((s, i) => 
    `<a class="${state.screen === s ? 'active' : ''}" onclick="showScreen('${s}')">${screenLabels[i]}</a>`
  ).join('');
}

function renderSidebar() {
  const s = state.screen;
  let html = '';
  
  const stats = state.statsData || {};
  const comm = state.communityData || {};
  const nNodes = stats.n_nodes ? stats.n_nodes.toLocaleString() : '65,046';
  const nEdges = stats.n_edges ? stats.n_edges.toLocaleString() : '73,879';
  const nComm = comm.n_communities || 96;
  const mod = comm.modularity ? comm.modularity.toFixed(2) : '0.64';

  if (s === 'dashboard') {
    html = `
      <div class="section">
        <div class="section-title"><i class="fas fa-database"></i> Field Stats</div>
        <div style="padding:10px;background:#fff;border:1px solid #e5e5e5">
          <div class="flex justify-between mb-4 text-xs"><span>Seeds:</span><strong>9</strong></div>
          <div class="flex justify-between mb-4 text-xs"><span>Actors:</span><strong>${nNodes}</strong></div>
          <div class="flex justify-between mb-4 text-xs"><span>Relations:</span><strong>${nEdges}</strong></div>
          <div class="flex justify-between mb-4 text-xs"><span>Regions:</span><strong>${nComm}</strong></div>
          <div class="flex justify-between text-xs"><span>Modularity:</span><strong>${mod}</strong></div>
        </div>
      </div>
      <div class="section">
        <div class="section-title"><i class="fas fa-tasks"></i> Pipeline</div>
        <div class="flex flex-col gap-4">
          ${['Seeds','Discovery','Denoise','Merge','Network','Regions'].map((step, i) => `
            <div class="flex items-center gap-8"><div class="step-badge complete"><i class="fas fa-check" style="font-size:8px"></i></div><span class="text-xs">${step}</span></div>
          `).join('')}
        </div>
      </div>
    `;
  } else if (s === 'seeds') {
    html = `
      <div class="section">
        <div class="section-title"><i class="fas fa-seedling"></i> Step 1: Seeds</div>
        <p class="text-xs text-gray mb-12">Select core participants with high field relevance</p>
        <div class="card"><div class="card-body">
          <div class="flex justify-between mb-4 text-xs"><span>Total Lists:</span><strong>2,303</strong></div>
          <div class="flex justify-between text-xs"><span>Avg/Seed:</span><strong>288</strong></div>
        </div></div>
      </div>
      <div class="section">
        <div class="section-title"><i class="fas fa-check-circle"></i> Guidelines</div>
        <div class="flex flex-col gap-8 text-xs">
          <div class="flex items-center gap-8"><i class="fas fa-check" style="color:#16a34a"></i> Expert consensus</div>
          <div class="flex items-center gap-8"><i class="fas fa-check" style="color:#16a34a"></i> Min 30+ list memberships</div>
          <div class="flex items-center gap-8"><i class="fas fa-check" style="color:#16a34a"></i> Spread for diversity</div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" onclick="showScreen('discovery')"><i class="fas fa-arrow-right"></i> Next</button>
    `;
  } else if (s === 'discovery') {
    html = `
      <div class="section">
        <div class="section-title"><i class="fas fa-search"></i> Steps 2-4</div>
        <p class="text-xs text-gray mb-12">Co-classification network via list memberships</p>
      </div>
      <div class="section">
        <div class="section-title"><i class="fas fa-sliders-h"></i> Parameters</div>
        <div class="mb-12"><label class="text-xs text-gray mb-4" style="display:block">Min Lists (k)</label><input class="input" type="number" value="3"></div>
        <div class="mb-12"><label class="text-xs text-gray mb-4" style="display:block">Max List Size</label><input class="input" type="number" value="500"></div>
      </div>
      <button class="btn btn-primary btn-block mb-8"><i class="fas fa-play"></i> Run Discovery</button>
      <button class="btn btn-block" onclick="showScreen('network')"><i class="fas fa-arrow-right"></i> View Network</button>
    `;
  } else if (s === 'network') {
    const density = stats.density ? stats.density.toExponential(2) : '1.75e-5';
    const recip = stats.reciprocity ? (stats.reciprocity * 100).toFixed(2) + '%' : '0.15%';
    const lcc = stats.largest_component_pct ? stats.largest_component_pct.toFixed(1) + '%' : '40.5%';
    const topComms = getTopCommunities().filter(r => !r.label.startsWith('Community')).slice(0, 7);

    html = `
      <div class="section">
        <div class="section-title"><i class="fas fa-project-diagram"></i> Network Stats</div>
        <div class="card"><div class="card-body">
          <div class="flex justify-between mb-4 text-xs"><span>Nodes:</span><strong>${nNodes}</strong></div>
          <div class="flex justify-between mb-4 text-xs"><span>Edges:</span><strong>${nEdges}</strong></div>
          <div class="flex justify-between mb-4 text-xs"><span>Density:</span><strong>${density}</strong></div>
          <div class="flex justify-between mb-4 text-xs"><span>Modularity:</span><strong>${mod}</strong></div>
          <div class="flex justify-between mb-4 text-xs"><span>Reciprocity:</span><strong>${recip}</strong></div>
          <div class="flex justify-between text-xs"><span>Giant Component:</span><strong style="color:#16a34a">${lcc}</strong></div>
        </div></div>
      </div>
      <div class="section">
        <div class="section-title"><i class="fas fa-palette"></i> Community Legend</div>
        <div class="flex flex-col gap-4">
          ${topComms.map(r => `
            <div class="flex items-center gap-8 text-xs"><div class="color-dot" style="background:${r.color}"></div>${r.label}</div>
          `).join('')}
          <div class="flex items-center gap-8 text-xs text-gray"><div class="color-dot" style="background:#999"></div>Other (${nComm - topComms.length} communities)</div>
        </div>
      </div>
      <div class="section">
        <button class="btn btn-block mb-8" onclick="exportGEXF()"><i class="fas fa-download"></i> Export GEXF</button>
        <button class="btn btn-block" onclick="exportCSV()"><i class="fas fa-download"></i> Export CSV</button>
      </div>
    `;
  } else if (s === 'regions') {
    const topRegions = getTopCommunities();
    html = `
      <div class="section">
        <div class="section-title"><i class="fas fa-layer-group"></i> Regions (${nComm})</div>
        <div class="flex flex-col gap-4">
          ${topRegions.slice(0, 8).map(r => `
            <div class="flex items-center gap-8 text-xs" style="padding:6px;cursor:pointer;background:#fff;border:1px solid #e5e5e5">
              <div class="color-dot" style="background:${r.color}"></div><span class="flex-1">${r.label}</span><span class="text-gray">${r.size.toLocaleString()}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <button class="btn btn-block" onclick="toast('Re-running Louvain...')"><i class="fas fa-redo"></i> Re-run Louvain</button>
    `;
  } else if (s === 'triangulation' || s === 'bridging') {
    html = `
      <div class="section">
        <div class="section-title"><i class="fas fa-info-circle"></i> About</div>
        <p class="text-xs text-gray">${s === 'triangulation' ? 'Mapping internal sociotypes to external sub-regions' : 'Identifying actors connecting sub-regions'}</p>
      </div>
    `;
  }
  
  document.getElementById('sidebar').innerHTML = html;
}

function render() {
  renderNav();
  renderSidebar();
  const s = state.screen;
  
  if (s === 'dashboard') renderDashboard();
  else if (s === 'seeds') renderSeeds();
  else if (s === 'discovery') renderDiscovery();
  else if (s === 'network') renderNetwork();
  else if (s === 'regions') renderRegions();
  else if (s === 'triangulation') renderTriangulation();
  else if (s === 'bridging') renderBridging();
}

function renderDashboard() {
  const stats = state.statsData || {};
  const comm = state.communityData || {};
  const nNodes = stats.n_nodes ? stats.n_nodes.toLocaleString() : '65,046';
  const nEdges = stats.n_edges ? stats.n_edges.toLocaleString() : '73,879';
  const nComm = comm.n_communities || 96;

  document.getElementById('screen-dashboard').innerHTML = `
    <h1 class="mb-16">Field Mapping <span>Dashboard</span></h1>
    <p class="text-gray mb-24">European Innovation Intermediaries · Social Curation Analysis</p>
    
    <div class="card mb-16">
      <div class="card-body flex items-center justify-between" style="flex-wrap:wrap;gap:12px">
        <div class="flex items-center gap-12" style="flex-wrap:wrap">
          ${['Seeds','Discovery','Denoise','Merge','Network','Regions'].map((step, i) => `
            <div class="flex items-center gap-8">
              <div class="step-badge complete"><i class="fas fa-check" style="font-size:8px"></i></div>
              <span class="text-xs">${step}</span>
            </div>
            ${i < 5 ? '<div style="width:30px;height:2px;background:#16a34a"></div>' : ''}
          `).join('')}
        </div>
        <span class="tag tag-success"><i class="fas fa-check"></i> Pipeline Complete</span>
      </div>
    </div>
    
    <div class="grid-4 mb-24">
      <div class="card" style="cursor:pointer" onclick="showScreen('seeds')">
        <div class="card-body text-center">
          <i class="fas fa-seedling" style="font-size:24px;margin-bottom:8px"></i>
          <div class="text-sm" style="font-weight:600">Select Seeds</div>
          <div class="text-xs text-gray">Core participants</div>
        </div>
      </div>
      <div class="card" style="cursor:pointer" onclick="showScreen('discovery')">
        <div class="card-body text-center">
          <i class="fas fa-search" style="font-size:24px;margin-bottom:8px"></i>
          <div class="text-sm" style="font-weight:600">Run Discovery</div>
          <div class="text-xs text-gray">Co-classification</div>
        </div>
      </div>
      <div class="card" style="cursor:pointer" onclick="showScreen('regions')">
        <div class="card-body text-center">
          <i class="fas fa-layer-group" style="font-size:24px;margin-bottom:8px"></i>
          <div class="text-sm" style="font-weight:600">Analyze Regions</div>
          <div class="text-xs text-gray">Louvain detection</div>
        </div>
      </div>
      <div class="card" style="cursor:pointer" onclick="showScreen('triangulation')">
        <div class="card-body text-center">

function initSigma() {
  const container = document.getElementById('sigma-container');
  if (!container || !state.networkData) return;

  sigmaGraph = new graphology.Graph();

  // Add nodes and store original positions
  state.networkData.nodes.forEach(node => {
    // Use ColorBrewer palette based on community label
    const commLabel = node.communityLabel || '';
    const commId = node.community || 0;
    const nodeColor = communityColors[commLabel] || categoryPalette[commId % categoryPalette.length];

    sigmaGraph.addNode(node.id, {
      label: node.label,
      x: node.x,
      y: node.y,
      size: Math.max(4, Math.min(25, node.size / 3)),
      color: nodeColor,
      communityLabel: commLabel
    });
    originalPositions[node.id] = { x: node.x, y: node.y };
  });

  // Add edges with subtle gray color for light background
  state.networkData.edges.forEach(edge => {
    if (!sigmaGraph.hasEdge(edge.source, edge.target)) {
      sigmaGraph.addEdge(edge.source, edge.target, { color: '#cccccc' });
    }
  });

  // Apply ForceAtlas2 layout to spread nodes
  console.log('Applying ForceAtlas2 layout...');
  forceAtlas2(sigmaGraph, 100, { gravity: 0.5, scalingRatio: 50, strongGravityMode: false });
  console.log('ForceAtlas2 layout complete');

  // Create Sigma instance
  if (sigmaInstance) sigmaInstance.kill();
  sigmaInstance = new Sigma(sigmaGraph, container, {
    renderEdgeLabels: false,
    labelColor: { color: '#333' },
    labelSize: 12,
    labelDensity: 0.07,
    defaultEdgeColor: '#cccccc',
    minCameraRatio: 0.1,
    maxCameraRatio: 10
  });

  // Node click handler
  sigmaInstance.on('clickNode', ({ node }) => {
    const attrs = sigmaGraph.getNodeAttributes(node);
    document.getElementById('node-info').style.display = 'block';
    document.getElementById('node-label').textContent = '@' + attrs.label;
    document.getElementById('node-comm').textContent = attrs.communityLabel || 'Unknown';
    document.getElementById('node-deg').textContent = sigmaGraph.degree(node);
  });

  // Search functionality
  document.getElementById('node-search').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    sigmaGraph.forEachNode((node, attrs) => {
      const match = attrs.label.toLowerCase().includes(query);
      sigmaGraph.setNodeAttribute(node, 'hidden', query && !match);
    });
    sigmaInstance.refresh();
  });
}

function applyLayout(layoutType) {
  if (!sigmaGraph || !sigmaInstance) return;

  toast('Applying ' + layoutType + ' layout...');

  if (layoutType === 'original') {
    sigmaGraph.forEachNode((node) => {
      if (originalPositions[node]) {
        sigmaGraph.setNodeAttribute(node, 'x', originalPositions[node].x);
        sigmaGraph.setNodeAttribute(node, 'y', originalPositions[node].y);
      }
    });
    sigmaInstance.refresh();
    toast('Original layout restored');
  }
  else if (layoutType === 'forceatlas2') {
    forceAtlas2(sigmaGraph, 100, { gravity: 0.5, scalingRatio: 50, strongGravityMode: false });
    sigmaInstance.refresh();
    toast('ForceAtlas2 applied');
  }
  else if (layoutType === 'fa2-strong') {
    forceAtlas2(sigmaGraph, 150, { gravity: 5, scalingRatio: 20, strongGravityMode: true });
    sigmaInstance.refresh();
    toast('FA2 Strong Gravity applied');
  }
  else if (layoutType === 'fa2-linlog') {
    forceAtlas2(sigmaGraph, 100, { gravity: 1, scalingRatio: 10, linLogMode: true });
    sigmaInstance.refresh();
    toast('FA2 LinLog applied - emphasizes clusters');
  }
  else if (layoutType === 'noverlap') {
    // Simple overlap removal
    const nodes = sigmaGraph.nodes();
    for (let iter = 0; iter < 50; iter++) {
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const n1 = nodes[i], n2 = nodes[j];
          const x1 = sigmaGraph.getNodeAttribute(n1, 'x'), y1 = sigmaGraph.getNodeAttribute(n1, 'y');
          const x2 = sigmaGraph.getNodeAttribute(n2, 'x'), y2 = sigmaGraph.getNodeAttribute(n2, 'y');
          const dx = x2 - x1, dy = y2 - y1;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const minDist = 15;
          if (dist < minDist) {
            const move = (minDist - dist) / 2;
            sigmaGraph.setNodeAttribute(n1, 'x', x1 - (dx / dist) * move);
            sigmaGraph.setNodeAttribute(n1, 'y', y1 - (dy / dist) * move);
            sigmaGraph.setNodeAttribute(n2, 'x', x2 + (dx / dist) * move);
            sigmaGraph.setNodeAttribute(n2, 'y', y2 + (dy / dist) * move);
          }
        }
      }
    }
    sigmaInstance.refresh();
    toast('Noverlap applied - removed overlaps');
  }
  else if (layoutType === 'circular') {
    const nodes = sigmaGraph.nodes();
    const n = nodes.length;
    const radius = Math.sqrt(n) * 15;
    nodes.forEach((node, i) => {
      const angle = (2 * Math.PI * i) / n;
      sigmaGraph.setNodeAttribute(node, 'x', radius * Math.cos(angle));
      sigmaGraph.setNodeAttribute(node, 'y', radius * Math.sin(angle));
    });
    sigmaInstance.refresh();
    toast('Circular layout applied');
  }
  else if (layoutType === 'grid') {
    const nodes = sigmaGraph.nodes();
    const cols = Math.ceil(Math.sqrt(nodes.length));
    const spacing = 30;
    nodes.forEach((node, i) => {
      sigmaGraph.setNodeAttribute(node, 'x', (i % cols) * spacing);
      sigmaGraph.setNodeAttribute(node, 'y', Math.floor(i / cols) * spacing);
    });
    sigmaInstance.refresh();
    toast('Grid layout applied');
  }
  else if (layoutType === 'random') {
    sigmaGraph.forEachNode((node) => {
      sigmaGraph.setNodeAttribute(node, 'x', (Math.random() - 0.5) * 1000);
      sigmaGraph.setNodeAttribute(node, 'y', (Math.random() - 0.5) * 1000);
    });
    sigmaInstance.refresh();
    toast('Random layout applied');
  }
}

function applyAntiCollision() {
  if (!sigmaGraph || !sigmaInstance) return;
  toast('Applying anti-collision...');

  const nodes = sigmaGraph.nodes();
  const nodeCount = nodes.length;
  const minDistance = 20; // Minimum distance between node centers
  const maxIterations = 100;
  const damping = 0.5;

  for (let iter = 0; iter < maxIterations; iter++) {
    let moved = false;

    // Use spatial grid for efficiency
    const gridSize = minDistance * 2;
    const grid = {};

    // Place nodes in grid cells
    nodes.forEach(n => {
      const x = sigmaGraph.getNodeAttribute(n, 'x');
      const y = sigmaGraph.getNodeAttribute(n, 'y');
      const cellX = Math.floor(x / gridSize);
      const cellY = Math.floor(y / gridSize);
      const key = `${cellX},${cellY}`;
      if (!grid[key]) grid[key] = [];
      grid[key].push({ id: n, x, y });
    });

    // Check collisions only within neighboring cells
    nodes.forEach(n => {
      const x1 = sigmaGraph.getNodeAttribute(n, 'x');
      const y1 = sigmaGraph.getNodeAttribute(n, 'y');
      const size1 = sigmaGraph.getNodeAttribute(n, 'size') || 5;
      const cellX = Math.floor(x1 / gridSize);
      const cellY = Math.floor(y1 / gridSize);

      let dx = 0, dy = 0;

      // Check 3x3 neighboring cells
      for (let cx = cellX - 1; cx <= cellX + 1; cx++) {
        for (let cy = cellY - 1; cy <= cellY + 1; cy++) {
          const neighbors = grid[`${cx},${cy}`] || [];
          neighbors.forEach(neighbor => {
            if (neighbor.id === n) return;
            const x2 = neighbor.x, y2 = neighbor.y;
            const diffX = x1 - x2, diffY = y1 - y2;
            const dist = Math.sqrt(diffX * diffX + diffY * diffY) || 0.001;
            const size2 = sigmaGraph.getNodeAttribute(neighbor.id, 'size') || 5;
            const requiredDist = minDistance + (size1 + size2) / 4;

            if (dist < requiredDist) {
              const overlap = requiredDist - dist;
              const pushX = (diffX / dist) * overlap * damping;
              const pushY = (diffY / dist) * overlap * damping;
              dx += pushX;
              dy += pushY;
              moved = true;
            }
          });
        }
      }

      if (dx !== 0 || dy !== 0) {
        sigmaGraph.setNodeAttribute(n, 'x', x1 + dx);
        sigmaGraph.setNodeAttribute(n, 'y', y1 + dy);
      }
    });

    if (!moved) break;
  }

  sigmaInstance.refresh();
  toast('Anti-collision complete');
}

  gexf += '</nodes>\n<edges>\n';
  let edgeId = 0;
  sigmaGraph.forEachEdge((id, attrs, source, target) => {
    gexf += `<edge id="${edgeId++}" source="${source}" target="${target}"/>\n`;
  });
  gexf += '</edges>\n</graph>\n</gexf>';
  downloadFile(gexf, 'eit_network.gexf', 'application/xml');

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
