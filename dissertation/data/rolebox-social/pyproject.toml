[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rolebox-social"
version = "0.1.0"
description = "Social media analysis for RoleBox - field mapping through Twitter/X curation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "tqdm",
    "openpyxl",
]

[project.optional-dependencies]
bertopic = [
    "bertopic>=0.16",
    "sentence-transformers>=2.2",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
]
llm = [
    "llama-cpp-python>=0.2",
]
viz = [
    "datamapplot",
    "pyvis",
    "plotly>=5.0",
]
all = [
    "rolebox-social[bertopic,llm,viz]",
]

[project.scripts]
rolebox-social-topics = "rolebox_social.topic_modeling:main"

[tool.setuptools.packages.find]
where = ["src"]
