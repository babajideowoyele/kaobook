# RoleBox-Social Conda Environment
# For Twitter/X social media analysis with BERTopic
#
# Setup:
#   conda env create -f environment.yml
#   conda activate rolebox-social
#
# For GPU acceleration (optional, requires NVIDIA GPU + CUDA):
#   pip install cudf-cu12 cuml-cu12 --extra-index-url=https://pypi.nvidia.com

name: rolebox-social
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pandas>=2.0
  - numpy>=1.24
  - openpyxl
  - xlrd
  - networkx>=3.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - scikit-learn>=1.3
  - scipy>=1.10
  - jupyter
  - jupyterlab
  - ipywidgets

  # NLP and text analysis
  - nltk
  - spacy>=3.5

  # PyTorch (for embeddings)
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - cpuonly  # Remove this line if using GPU

  # Data processing
  - tqdm
  - pyarrow
  - fastparquet

  - pip
  - pip:
    # BERTopic and dependencies
    - bertopic>=0.16
    - sentence-transformers>=2.2
    - umap-learn>=0.5
    - hdbscan>=0.8

    # LLM for topic labeling (quantized)
    - llama-cpp-python>=0.2

    # Visualization
    - datamapplot
    - pyvis
    - plotly>=5.0

    # Twitter/social
    - tweepy>=4.14
    - python-dotenv

    # Utilities
    - datasets  # HuggingFace datasets
    - huggingface-hub
