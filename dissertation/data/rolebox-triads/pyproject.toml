[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rolebox-triads"
version = "0.1.0"
description = "Triad visualization framework for multimodal role constellation cartography"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Babajide Alamu Owoyele", email = "owoyele@rsm.nl"}
]
keywords = ["visualization", "ternary", "triangulation", "roles", "dissertation"]

dependencies = [
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
