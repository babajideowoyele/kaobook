# Pre-commit hooks for kaobook
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.pdf$|\.eps$|\.png$|\.jpg$'
      - id: end-of-file-fixer
        exclude: '\.pdf$|\.eps$|\.png$|\.jpg$'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: '\.pdf$'
      - id: mixed-line-endings
        args: ['--fix=lf']
        exclude: '\.pdf$|\.eps$'
      - id: check-merge-conflict

  # LaTeX-specific linting with chktex
  - repo: https://github.com/jonasbb/pre-commit-latex-hooks
    rev: v1.4.0
    hooks:
      - id: american-eg-ie
        exclude: 'references\.bib$'
      - id: cleveref-capitalization
      - id: consistent-spelling
        args:
          - '--emph=color,colour,color'
          - '--emph=acknowledgment,acknowledgement,acknowledgment'
      - id: csquotes
      - id: no-space-in-cite
      - id: tilde-cite
      - id: unique-labels

  # ChkTeX for deeper LaTeX analysis (local hook)
  - repo: local
    hooks:
      - id: chktex
        name: chktex
        entry: chktex
        language: system
        files: '\.tex$'
        args:
          - '-q'           # Quiet mode
          - '-n1'          # Ignore: Command terminated with space
          - '-n2'          # Ignore: Non-breaking space (~) should have been used
          - '-n3'          # Ignore: You should enclose the previous parenthesis with '{}'
          - '-n6'          # Ignore: No italic correction
          - '-n8'          # Ignore: Wrong length of dash
          - '-n24'         # Ignore: Delete this space to maintain correct pagereferences
          - '-n36'         # Ignore: You should put a space in front of parenthesis
          - '-n44'         # Ignore: User Regex
        exclude: |
          (?x)^(
            .*\.cls$|
            .*\.sty$
          )$

  # BibTeX validation
  - repo: local
    hooks:
      - id: bibtex-check
        name: bibtex-check
        entry: python -c "import sys; f=open(sys.argv[1]); content=f.read(); f.close(); errors=[]; [errors.append(f'Line {i+1}: Unclosed brace') for i,line in enumerate(content.split('\n')) if line.count('{') != line.count('}') and not line.strip().startswith('%')]; print('\n'.join(errors)) if errors else None; sys.exit(1 if errors else 0)"
        language: system
        files: '\.bib$'
        pass_filenames: true

# Configuration for specific hooks
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: monthly
